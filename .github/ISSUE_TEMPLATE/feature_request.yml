name: Feature Request
description: Proposer une nouvelle fonctionnalité pour l'API Task
title: "[FEATURE] "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Expliquez clairement ce que cette fonctionnalité apporte.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Critères d'acceptation
      description: Liste à cocher des conditions pour considérer la tâche terminée.
      value: |
        - [ ] Le endpoint répond selon les spécifications
        - [ ] Les tests automatisés couvrent les cas nominaux et d'erreurs
        - [ ] La documentation / README est à jour
    validations:
      required: true